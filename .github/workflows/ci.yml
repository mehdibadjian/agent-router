name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Correctness gate on the host toolchain. No network: fail-open paths use an
  # unreachable local endpoint, so the whole suite runs offline and deterministically.
  test:
    name: Test (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Unit + integration tests (workspace)
        run: cargo test --workspace --all-targets

      # Spec §2 NFR: the engine must compile and be testable with no network stack at
      # all. With the `llm` feature off, `ureq` must not appear in the dependency graph.
      - name: Assert s1s2-core is network-free by default
        run: |
          set -euo pipefail
          cargo test -p s1s2-core --all-targets
          COUNT="$(cargo tree -p s1s2-core -e normal --prefix none | grep -cE '^ureq ' || true)"
          echo "ureq nodes in default-feature s1s2-core graph: ${COUNT}"
          [ "$COUNT" = "0" ] || { echo "FAIL: ureq leaked into the default core graph"; exit 1; }

      # Informational only: sources were transcribed from
      # docs/IMPLEMENTATION_PLAN.md, not emitted by rustfmt, so a hard gate here
      # would fail on cosmetic drift that does not affect behaviour.
      - name: rustfmt (informational)
        run: cargo fmt --all --check
        continue-on-error: true

      - name: clippy (informational)
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true

  # The headline NFR: a fully static binary with no dynamic C dependencies.
  # Asserted with ldd/readelf, which are only meaningful on Linux/musl.
  # `ring` (via rustls) needs a C compiler, hence musl-tools.
  linux-static:
    name: Static Linux (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release for ${{ matrix.target }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Assert fully static linkage (ldd)
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/agent-router"
          # ldd exits non-zero when it reports a static binary, so capture its
          # output rather than relying on the pipeline status under pipefail.
          OUT="$(ldd "$BIN" 2>&1 || true)"
          echo "--- ldd ---"
          echo "$OUT"
          echo "-----------"
          case "$OUT" in
            *"not a dynamic executable"* | *"statically linked"*)
              echo "OK: no dynamic dependencies" ;;
            *)
              echo "FAIL: binary is dynamically linked"
              exit 1 ;;
          esac
          if echo "$OUT" | grep -qE '\.so'; then
            echo "FAIL: shared objects listed by ldd"
            exit 1
          fi

      - name: Assert no libssl / libcrypto / libsqlite3 / libstdc++
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/agent-router"
          NEEDED="$(readelf -d "$BIN" 2>/dev/null | grep -iE 'sharedlib|\(NEEDED\)' || true)"
          echo "NEEDED entries: [${NEEDED}]"
          if echo "$NEEDED" | grep -qiE 'libssl|libcrypto|libsqlite3|libstdc\+\+|libgcc_s\.so\.'; then
            echo "FAIL: forbidden shared library in NEEDED"
            exit 1
          fi
          echo "OK: no forbidden shared libraries"

      - name: Assert release binary under 5 MiB
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/agent-router"
          SIZE="$(stat -c %s "$BIN")"
          echo "$BIN = $SIZE bytes (limit $((5 * 1024 * 1024)))"
          [ "$SIZE" -lt $((5 * 1024 * 1024)) ] || { echo "FAIL: exceeds 5 MiB NFR"; exit 1; }
          echo "OK: within size budget"

      - name: Smoke test fail-open routing (native arch)
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/agent-router"
          mkdir -p .agents
          printf -- '---\nname: rust-architect\ndescription: Systems architect\ntriggers: [rust, lifetime]\n---\n' > .agents/rust-architect.md
          ROUTER_LLM_URL="http://127.0.0.1:1/v1/chat/completions" ROUTER_TIMEOUT_MS=200 \
            "$BIN" "fix rust lifetime in parser" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['routing']['target_subagent'] == 'rust-architect', d
          assert d['session_meta']['action'] == 'CONTINUE_SESSION', d
          print('OK: fail-open routing correct on', sys.argv[1])
          " "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: agent-router-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/agent-router
          if-no-files-found: error

  # Windows static CRT via .cargo/config.toml (crt-static). Build + size are hard
  # gates; the import scan is heuristic (no ldd on MSVC), so it is informational.
  windows-static:
    name: Static Windows (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release (crt-static)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Assert binary under 5 MiB
        shell: pwsh
        run: |
          $bin = "target/x86_64-pc-windows-msvc/release/agent-router.exe"
          $size = (Get-Item $bin).Length
          Write-Host "$bin = $size bytes (limit 5242880)"
          if ($size -ge 5MB) { throw "FAIL: binary exceeds 5 MiB NFR" }

      - name: Scan for OpenSSL / SQLite imports (informational)
        shell: pwsh
        run: |
          $text = [Text.Encoding]::ASCII.GetString(
            [IO.File]::ReadAllBytes("target/x86_64-pc-windows-msvc/release/agent-router.exe"))
          foreach ($bad in @("libcrypto", "libssl-", "sqlite3", "MSVCRT.dll")) {
            if ($text.Contains($bad)) { Write-Host "WARN: substring '$bad' present (heuristic)" }
          }
          Write-Host "OK: heuristic import scan complete"
        continue-on-error: true

      - name: Smoke test fail-open routing
        shell: pwsh
        run: |
          $env:ROUTER_LLM_URL = "http://127.0.0.1:1/v1/chat/completions"
          $env:ROUTER_TIMEOUT_MS = "200"
          New-Item -ItemType Directory -Force -Path .agents | Out-Null
          Set-Content -Path .agents/rust-architect.md -Value "---`nname: rust-architect`ndescription: Systems architect`ntriggers: [rust, lifetime]`n---"
          $out = & target/x86_64-pc-windows-msvc/release/agent-router.exe "fix rust lifetime in parser" | Out-String
          $d = $out | ConvertFrom-Json
          if ($d.routing.target_subagent -ne "rust-architect") { throw "FAIL: wrong agent: $out" }
          Write-Host "OK: fail-open routing correct on Windows"

      - uses: actions/upload-artifact@v4
        with:
          name: agent-router-x86_64-pc-windows-msvc
          path: target/x86_64-pc-windows-msvc/release/agent-router.exe
          if-no-files-found: error

  # macOS: the arm64 runner's Xcode toolchain is universal, so both arch slices
  # build on one host, then lipo merges them into a single fat binary.
  macos-universal:
    name: macOS Universal (aarch64 + x86_64)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build both architectures
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Create and verify universal binary
        run: |
          set -euo pipefail
          lipo -create \
            target/aarch64-apple-darwin/release/agent-router \
            target/x86_64-apple-darwin/release/agent-router \
            -output agent-router-universal
          INFO="$(lipo -info agent-router-universal)"
          echo "$INFO"
          echo "$INFO" | grep -q x86_64
          echo "$INFO" | grep -q arm64

      - name: Assert no libssl / libcrypto / sqlite3 linkage
        run: |
          set -euo pipefail
          otool -L target/aarch64-apple-darwin/release/agent-router
          if otool -L target/aarch64-apple-darwin/release/agent-router \
               | grep -qiE 'libssl|libcrypto|sqlite3'; then
            echo "FAIL: forbidden dynamic library linked"
            exit 1
          fi
          echo "OK: system frameworks only"

      - name: Assert each arch slice under 5 MiB
        run: |
          set -euo pipefail
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            SIZE="$(stat -f %z "target/$t/release/agent-router")"
            echo "$t = $SIZE bytes"
            [ "$SIZE" -lt $((5 * 1024 * 1024)) ] || { echo "FAIL: $t slice exceeds 5 MiB"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: agent-router-macos-universal
          path: agent-router-universal
          if-no-files-found: error

  # Combine the three platform artifacts into one distributable bundle.
  release-bundle:
    name: Bundle static binaries
    runs-on: ubuntu-latest
    needs: [linux-static, windows-static, macos-universal]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false

      - name: Assemble bundle
        run: |
          set -euo pipefail
          find dist -type f | sort
          mkdir -p release-assets
          cp dist/agent-router-x86_64-unknown-linux-musl/agent-router release-assets/agent-router-x86_64-unknown-linux-musl
          cp dist/agent-router-aarch64-unknown-linux-musl/agent-router release-assets/agent-router-aarch64-unknown-linux-musl
          cp dist/agent-router-x86_64-pc-windows-msvc/agent-router.exe release-assets/agent-router-x86_64-pc-windows-msvc.exe
          cp dist/agent-router-macos-universal/agent-router-universal release-assets/agent-router-macos-universal
          chmod +x release-assets/agent-router-x86_64-unknown-linux-musl \
                   release-assets/agent-router-aarch64-unknown-linux-musl \
                   release-assets/agent-router-macos-universal
          tar -czf release-assets/agent-router-static-binaries.tar.gz -C dist .
          ls -la release-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: agent-router-static-bundle
          path: release-assets/*
          if-no-files-found: error

  # Run release-please on main and auto-approve/auto-cut tags & GitHub Releases.
  release-please:
    name: Release Please
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      release_created: ${{ steps.final.outputs.release_created }}
      tag_name: ${{ steps.final.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Auto-approve and finalize release if Release PR was opened
        id: auto
        if: steps.rp.outputs.release_created != 'true' && steps.rp.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RP_PR_JSON: ${{ steps.rp.outputs.pr }}
        run: |
          set -euo pipefail
          PR_NUM="$(echo "$RP_PR_JSON" | jq -r '.number')"
          HEAD_BRANCH="$(echo "$RP_PR_JSON" | jq -r '.headBranchName')"
          PR_TITLE="$(echo "$RP_PR_JSON" | jq -r '.title')"
          PR_BODY="$(echo "$RP_PR_JSON" | jq -r '.body')"
          echo "Detected Release PR #${PR_NUM} (${HEAD_BRANCH}): ${PR_TITLE}"

          # Attempt squash-merge of the Release PR into main
          if gh pr merge "$PR_NUM" --squash --delete-branch; then
            echo "Merged Release PR #${PR_NUM}; pulling updated main..."
            git fetch origin main
            git checkout -B main origin/main
            echo "merged_pr=true" >> "$GITHUB_OUTPUT"
            # Clean up any phantom pull_request workflow runs queued on the deleted release-please branch
            sleep 3
            for run_id in $(gh run list --branch "$HEAD_BRANCH" --event pull_request --json databaseId -q '.[].databaseId' 2>/dev/null || true); do
              gh run delete "$run_id" || true
            done
          else
            echo "Direct bot PR merge blocked by branch ruleset; cutting tag & GitHub Release directly from Release PR metadata..."
            git fetch origin "$HEAD_BRANCH"
            NEW_VER="$(git show "origin/${HEAD_BRANCH}:.release-please-manifest.json" | jq -r '.["."]')"
            TAG="v${NEW_VER}"
            echo "Target tag: ${TAG}"
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" \
                --target "${{ github.sha }}" \
                --title "AgentRouter ${TAG}" \
                --notes "$PR_BODY"
            fi
            echo "direct_release_created=true" >> "$GITHUB_OUTPUT"
            echo "direct_tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cut release from newly merged Release PR
        id: rp2
        if: steps.auto.outputs.merged_pr == 'true'
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Export release outputs
        id: final
        run: |
          set -euo pipefail
          if [ "${{ steps.rp.outputs.release_created }}" = "true" ]; then
            echo "release_created=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=${{ steps.rp.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.rp2.outputs.release_created }}" = "true" ]; then
            echo "release_created=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=${{ steps.rp2.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.auto.outputs.direct_release_created }}" = "true" ]; then
            echo "release_created=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=${{ steps.auto.outputs.direct_tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "release_created=false" >> "$GITHUB_OUTPUT"
            echo "tag_name=" >> "$GITHUB_OUTPUT"
          fi

  # Attach the cross-compiled static binaries to the GitHub Release created by release-please.
  publish-release:
    name: Upload Release Assets
    if: needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name != ''
    runs-on: ubuntu-latest
    needs: [release-please, release-bundle]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agent-router-static-bundle
          path: assets

      - name: Upload static binaries to GitHub Release
        run: |
          set -euo pipefail
          ls -la assets/
          cp assets/agent-router-static-binaries.tar.gz "assets/agent-router-${TAG}-static-binaries.tar.gz"
          gh release upload "$TAG" \
            --repo "${{ github.repository }}" \
            assets/agent-router-x86_64-unknown-linux-musl \
            assets/agent-router-aarch64-unknown-linux-musl \
            assets/agent-router-x86_64-pc-windows-msvc.exe \
            assets/agent-router-macos-universal \
            "assets/agent-router-${TAG}-static-binaries.tar.gz" \
            --clobber

