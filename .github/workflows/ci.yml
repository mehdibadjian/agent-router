name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Correctness gate on the host toolchain. No network: fail-open paths use an
  # unreachable local endpoint, so the whole suite runs offline and deterministically.
  test:
    name: Test (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Unit + integration tests
        run: cargo test --all-targets

      # Informational only: sources were transcribed from
      # docs/IMPLEMENTATION_PLAN.md, not emitted by rustfmt, so a hard gate here
      # would fail on cosmetic drift that does not affect behaviour.
      - name: rustfmt (informational)
        run: cargo fmt --all --check
        continue-on-error: true

      - name: clippy (informational)
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

  # The headline NFR: a fully static binary with no dynamic C dependencies.
  # Asserted with ldd/readelf, which are only meaningful on Linux/musl.
  # `ring` (via rustls) needs a C compiler, hence musl-tools.
  linux-static:
    name: Static Linux (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release for ${{ matrix.target }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Assert fully static linkage (ldd)
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/agent-router"
          # ldd exits non-zero when it reports a static binary, so capture its
          # output rather than relying on the pipeline status under pipefail.
          OUT="$(ldd "$BIN" 2>&1 || true)"
          echo "--- ldd ---"
          echo "$OUT"
          echo "-----------"
          case "$OUT" in
            *"not a dynamic executable"* | *"statically linked"*)
              echo "OK: no dynamic dependencies" ;;
            *)
              echo "FAIL: binary is dynamically linked"
              exit 1 ;;
          esac
          if echo "$OUT" | grep -qE '\.so'; then
            echo "FAIL: shared objects listed by ldd"
            exit 1
          fi

      - name: Assert no libssl / libcrypto / libsqlite3 / libstdc++
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/agent-router"
          NEEDED="$(readelf -d "$BIN" 2>/dev/null | grep -iE 'sharedlib|\(NEEDED\)' || true)"
          echo "NEEDED entries: [${NEEDED}]"
          if echo "$NEEDED" | grep -qiE 'libssl|libcrypto|libsqlite3|libstdc\+\+|libgcc_s\.so\.'; then
            echo "FAIL: forbidden shared library in NEEDED"
            exit 1
          fi
          echo "OK: no forbidden shared libraries"

      - name: Assert release binary under 5 MiB
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/agent-router"
          SIZE="$(stat -c %s "$BIN")"
          echo "$BIN = $SIZE bytes (limit $((5 * 1024 * 1024)))"
          [ "$SIZE" -lt $((5 * 1024 * 1024)) ] || { echo "FAIL: exceeds 5 MiB NFR"; exit 1; }
          echo "OK: within size budget"

      - name: Smoke test fail-open routing (native arch)
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/agent-router"
          mkdir -p .agents
          printf -- '---\nname: rust-architect\ndescription: Systems architect\ntriggers: [rust, lifetime]\n---\n' > .agents/rust-architect.md
          ROUTER_LLM_URL="http://127.0.0.1:1/v1/chat/completions" ROUTER_TIMEOUT_MS=200 \
            "$BIN" "fix rust lifetime in parser" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['routing']['target_subagent'] == 'rust-architect', d
          assert d['session_meta']['action'] == 'CONTINUE_SESSION', d
          print('OK: fail-open routing correct on', sys.argv[1])
          " "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: agent-router-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/agent-router
          if-no-files-found: error

  # Windows static CRT via .cargo/config.toml (crt-static). Build + size are hard
  # gates; the import scan is heuristic (no ldd on MSVC), so it is informational.
  windows-static:
    name: Static Windows (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release (crt-static)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Assert binary under 5 MiB
        shell: pwsh
        run: |
          $bin = "target/x86_64-pc-windows-msvc/release/agent-router.exe"
          $size = (Get-Item $bin).Length
          Write-Host "$bin = $size bytes (limit 5242880)"
          if ($size -ge 5MB) { throw "FAIL: binary exceeds 5 MiB NFR" }

      - name: Scan for OpenSSL / SQLite imports (informational)
        shell: pwsh
        run: |
          $text = [Text.Encoding]::ASCII.GetString(
            [IO.File]::ReadAllBytes("target/x86_64-pc-windows-msvc/release/agent-router.exe"))
          foreach ($bad in @("libcrypto", "libssl-", "sqlite3", "MSVCRT.dll")) {
            if ($text.Contains($bad)) { Write-Host "WARN: substring '$bad' present (heuristic)" }
          }
          Write-Host "OK: heuristic import scan complete"
        continue-on-error: true

      - name: Smoke test fail-open routing
        shell: pwsh
        run: |
          $env:ROUTER_LLM_URL = "http://127.0.0.1:1/v1/chat/completions"
          $env:ROUTER_TIMEOUT_MS = "200"
          New-Item -ItemType Directory -Force -Path .agents | Out-Null
          Set-Content -Path .agents/rust-architect.md -Value "---`nname: rust-architect`ndescription: Systems architect`ntriggers: [rust, lifetime]`n---"
          $out = & target/x86_64-pc-windows-msvc/release/agent-router.exe "fix rust lifetime in parser" | Out-String
          $d = $out | ConvertFrom-Json
          if ($d.routing.target_subagent -ne "rust-architect") { throw "FAIL: wrong agent: $out" }
          Write-Host "OK: fail-open routing correct on Windows"

      - uses: actions/upload-artifact@v4
        with:
          name: agent-router-x86_64-pc-windows-msvc
          path: target/x86_64-pc-windows-msvc/release/agent-router.exe
          if-no-files-found: error

  # macOS: the arm64 runner's Xcode toolchain is universal, so both arch slices
  # build on one host, then lipo merges them into a single fat binary.
  macos-universal:
    name: macOS Universal (aarch64 + x86_64)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build both architectures
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Create and verify universal binary
        run: |
          set -euo pipefail
          lipo -create \
            target/aarch64-apple-darwin/release/agent-router \
            target/x86_64-apple-darwin/release/agent-router \
            -output agent-router-universal
          INFO="$(lipo -info agent-router-universal)"
          echo "$INFO"
          echo "$INFO" | grep -q x86_64
          echo "$INFO" | grep -q arm64

      - name: Assert no libssl / libcrypto / sqlite3 linkage
        run: |
          set -euo pipefail
          otool -L target/aarch64-apple-darwin/release/agent-router
          if otool -L target/aarch64-apple-darwin/release/agent-router \
               | grep -qiE 'libssl|libcrypto|sqlite3'; then
            echo "FAIL: forbidden dynamic library linked"
            exit 1
          fi
          echo "OK: system frameworks only"

      - name: Assert each arch slice under 5 MiB
        run: |
          set -euo pipefail
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            SIZE="$(stat -f %z "target/$t/release/agent-router")"
            echo "$t = $SIZE bytes"
            [ "$SIZE" -lt $((5 * 1024 * 1024)) ] || { echo "FAIL: $t slice exceeds 5 MiB"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: agent-router-macos-universal
          path: agent-router-universal
          if-no-files-found: error

  # Combine the three platform artifacts into one distributable bundle.
  release-bundle:
    name: Bundle static binaries
    runs-on: ubuntu-latest
    needs: [linux-static, windows-static, macos-universal]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false

      - name: Assemble bundle
        run: |
          set -euo pipefail
          find dist -type f | sort
          tar -czf agent-router-0.1.0-static-binaries.tar.gz -C dist .
          ls -l agent-router-0.1.0-static-binaries.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: agent-router-static-bundle
          path: agent-router-0.1.0-static-binaries.tar.gz
          if-no-files-found: error
