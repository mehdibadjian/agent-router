[package]
name = "agent-router"
version = "0.2.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
ureq = { version = "2.10.1", default-features = false, features = ["tls", "json"] }
xxhash-rust = { version = "0.8.12", features = ["xxh3"] }
walkdir = "2.5.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
